name: Translation resources

on:
  pull_request:
  push:
    branches:
      - main
      - feat/zh-cn
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-resources:
    name: Check locale keys and report untranslated strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check translation resources
        run: node scripts/check-translations.mjs
